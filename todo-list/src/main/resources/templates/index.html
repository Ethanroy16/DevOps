<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="container">

    <header>
        <h1>My To-Do List</h1>
        <p>Manage your tasks using the task manager.</p>
    </header>

    <!-- Add Task -->
    <section class="add-task">
        <h2>Add New Task</h2>

        <form th:action="@{/tasks}" method="post">

            <div class="form-group">
                <input
                        type="text"
                        name="title"
                        placeholder="Task title"
                        required>
            </div>

            <div class="form-group">
                <textarea
                        name="description"
                        placeholder="Task description"></textarea>
            </div>

            <button type="submit" class="btn btn-primary">
                Add Task
            </button>

        </form>
    </section>

    <!-- Error Message -->
    <div th:if="${error}" class="error-message">
        <p th:text="${error}"></p>
    </div>

    <!-- Statistics -->
    <section class="statistics">

        <div class="stat-card">
            <h3>Total</h3>
            <p th:text="${total}">0</p>
        </div>

        <div class="stat-card">
            <h3>Completed</h3>
            <p th:text="${completed}">0</p>
        </div>

        <div class="stat-card">
            <h3>Remaining</h3>
            <p th:text="${remaining}">0</p>
        </div>

    </section>

    <!-- Tasks -->
    <section class="tasks">

        <h2>Your Tasks</h2>

        <div th:if="${#lists.isEmpty(tasks)}" class="no-tasks">
            <p>No tasks available. Add a new task above!</p>
        </div>

        <div th:each="task : ${tasks}" class="task-card">

            <div class="task-content">

                <h3 th:text="${task.title}">Task title</h3>

                <p th:text="${task.description}">
                    Task description
                </p>

                <span
                        th:if="${task.completed}"
                        class="status completed">
                    Completed
                </span>

                <span
                        th:unless="${task.completed}"
                        class="status pending">
                    Pending
                </span>

            </div>

            <div class="task-actions">

                <!-- Complete -->
                <form
                        th:if="${!task.completed}"
                        th:action="@{/tasks/{id}/complete(id=${task.id})}"
                        method="post">

                    <button type="submit" class="btn btn-success">
                        Complete
                    </button>

                </form>

                <!-- Undo -->
                <form
                        th:if="${task.completed}"
                        th:action="@{/tasks/{id}/uncomplete(id=${task.id})}"
                        method="post">

                    <button type="submit" class="btn btn-warning">
                        Undo
                    </button>

                </form>

                <!-- Delete -->
                <form
                        th:action="@{/tasks/{id}/delete(id=${task.id})}"
                        method="post">

                    <button type="submit" class="btn btn-danger">
                        Delete
                    </button>

                </form>

            </div>

        </div>

    </section>

</div>

</body>
</html>
