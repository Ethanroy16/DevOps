<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>To-Do List</title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body>

<div class="container">

    <h1>My To-Do List</h1>

    <p>Manage your tasks using the task manager.</p>

<h2>Add New Task</h2>

<form action="/tasks" method="post">

    <input
            type="text"
            name="title"
            placeholder="Task title"
            required>

    <textarea
            name="description"
            placeholder="Task description"></textarea>

    <button type="submit">
        Add Task
    </button>

</form>

     <div
        th:if="${error}"
        class="error"
        th:text="${error}">
     </div>

    <div class="tasks">

        <div th:each="task : ${tasks}"
     class="task">

    <h3 th:text="${task.title}">
        Task title
    </h3>

    <p th:text="${task.description}">
        Task description
    </p>

    <p th:if="${task.completed}">
        ✓ Completed
    </p>

    <div class="statistics">

    <div class="stat">
        <h3>Total</h3>
        <p th:text="${totalTasks}">0</p>
    </div>

    <div class="stat">
        <h3>Completed</h3>
        <p th:text="${completedTasks}">0</p>
    </div>

    <div class="stat">
        <h3>Remaining</h3>
        <p th:text="${incompleteTasks}">0</p>
    </div>

</div>

    <form
            th:if="${!task.completed}"
            th:action="@{/tasks/{id}/complete(id=${task.id})}"
            method="post">

        <button type="submit">
            Complete
        </button>

    </form>

    <form
            th:if="${task.completed}"
            th:action="@{/tasks/{id}/uncomplete(id=${task.id})}"
            method="post">

        <button type="submit">
            Undo
        </button>

    </form>

    <form
        th:action="@{/tasks/{id}/delete(id=${task.id})}"
        method="post">

    <button type="submit">
        Delete
    </button>

    </form>

</div>

    </div>

</div>

</body>

</html>
